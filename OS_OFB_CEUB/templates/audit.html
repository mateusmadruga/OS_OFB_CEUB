{% extends 'base.html' %}{% block content %}<h1>Trilha de auditoria</h1><div class="card p-3 table-responsive"><table class="table table-sm"><thead><tr><th>Data</th><th>Ator</th><th>Ação</th><th>Entidade</th><th>Detalhe</th><th>IP</th></tr></thead><tbody>{% for x in items %}<tr><td>{{x.created_at.strftime('%d/%m/%Y %H:%M')}}</td><td>{{x.actor.name if x.actor else 'sistema'}}</td><td>{{x.action}}</td><td>{{x.entity}} #{{x.entity_id or ''}}</td><td>{{x.detail}}</td><td>{{x.ip}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
