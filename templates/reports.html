{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><div><h1>Relatórios</h1><p class="text-muted">Consolidação por situação e exportação analítica.</p></div><a class="btn btn-primary" href="{{url_for('report_csv')}}">Baixar CSV</a></div><div class="card p-3 table-responsive"><table class="table"><thead><tr><th>Status</th><th>Quantidade</th><th>Valor</th></tr></thead><tbody>{% for status,count,value in rows %}<tr><td>{{status|replace('_',' ')}}</td><td>{{count}}</td><td>R$ {{'%.2f'|format(value)}}</td></tr>{% else %}<tr><td colspan="3">Sem dados.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
